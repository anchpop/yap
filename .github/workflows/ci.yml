name: Rust CI

on:
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    runs-on: big-runner
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: "1.96.0"
          override: true
          components: rustfmt, clippy
          target: wasm32-unknown-unknown

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-ci
          restore-keys: |
            ${{ runner.os }}-cargo-ci-
            ${{ runner.os }}-cargo-

      - name: Rustfmt
        uses: actions-rs/cargo@v1
        with:
          command: fmt
          args: --all -- --check

      - name: Clippy
        uses: actions-rs/cargo@v1
        with:
          command: clippy
          args: --workspace -- -D warnings

      - name: Clippy (WASM)
        run: cargo clippy --target wasm32-unknown-unknown -- -D warnings
        working-directory: yap-frontend-rs

      - uses: taiki-e/install-action@nextest

      - name: Tests (default features)
        uses: actions-rs/cargo@v1
        with:
          command: nextest
          args: run --all

      - name: Tests (no default features)
        uses: actions-rs/cargo@v1
        with:
          command: nextest
          args: run --all --no-default-features

  # Verify the custom espeak-ng fork (anchpop/espeak-ng) still builds and can
  # phonemize — the translation grader shells out to it at runtime. Only the
  # `espeak-builder` Docker stage is built here (it clones + compiles the fork);
  # the full image build happens in deploy.yml. This catches a broken fork bump
  # on the PR instead of at deploy time.
  espeak:
    runs-on: big-runner
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Build espeak-ng fork stage
        run: docker build --target espeak-builder -t espeak-fork -f yap-ai-backend/Dockerfile .

      - name: Verify phonemization
        run: |
          docker run --rm espeak-fork sh -c \
            '/espeak-install/usr/bin/espeak-ng --path=/espeak-install/usr/share \
             -v fr -q --ipa -x "on est" | grep -q .'
