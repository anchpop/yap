name: Rust CI

on:
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    runs-on: big-runner
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: false

      # Only the rkyv packs are needed to build (ai-backend include_bytes!s
      # them); pulling all of LFS is several GB slower.
      - name: Pull LFS rkyv files
        run: git lfs pull --include="out/*_for_*/language_data.rkyv"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      # Keyed on Cargo.lock so the cache is re-saved whenever dependencies
      # change. (A constant key is a trap: actions/cache never re-saves on a
      # primary-key hit, so the cache silently freezes at its first save and
      # every later run recompiles everything newer than it.)
      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-ci-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-ci-
            ${{ runner.os }}-cargo-

      - uses: taiki-e/install-action@nextest

      - name: Rustfmt
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Clippy (WASM)
        run: cargo clippy --target wasm32-unknown-unknown -- -D warnings
        working-directory: yap-frontend-rs

      - name: Tests (default features)
        run: cargo nextest run --all

      - name: Tests (no default features)
        run: cargo nextest run --all --no-default-features

  # Verify the custom espeak-ng fork (anchpop/espeak-ng) still builds and can
  # phonemize — the transcription grader shells out to it at runtime. Only the
  # `espeak-builder` Docker stage is built here (it clones + compiles the fork);
  # the full image build happens in deploy.yml. This catches a broken fork bump
  # on the PR instead of at deploy time.
  espeak:
    runs-on: big-runner
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: false

      - name: Build espeak-ng fork stage
        run: docker build --target espeak-builder -t espeak-fork -f yap-ai-backend/Dockerfile .

      - name: Verify phonemization
        run: |
          docker run --rm espeak-fork sh -c \
            '/espeak-install/usr/bin/espeak-ng --path=/espeak-install/usr/share \
             -v fr -q --ipa -x "on est" | grep -q .'
