[project]
name = "polysemy"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.4",
    "transformers>=4.48,<5",
    "numpy",
    "scikit-learn",
    "scipy>=1.18.0",
    "einops>=0.8.2",
]

# CPU-only torch: this experiment must not touch the local GPU.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
