[workspace]
members = [
    "yap-ai-backend",
    "generate-data",
    "language-utils",
    "yap-frontend-rs",
    "libraries/autograde-core",
    "libraries/espeak",
    "libraries/weapon",
    "libraries/imdex_map",
    "libraries/eyedee",
    "libraries/course-spot-check",
    "libraries/sentence-sampler",
    "libraries/clean-nlp-data",
    "libraries/enumap",
    "libraries/opensubtitles-downloader",
    "libraries/omnigram",
    "libraries/weekly-active-users",
    "libraries/google-tts",
    "generate-dictionary-data",
    "yap-mcp",
]
resolver = "3"

[workspace.dependencies]
html2text = "0.17"
html-escape = "0.2"
markdown-tables = "0.1.0"
rusqlite = "0.40"
serde_json = "1.0"
tempfile = "3.27.0"
zip = "8"
schemars = "1"
futures = "0.3.32"
env_logger = "0.11.10"
tsify = { version = "0.5.6", features = ["js"], default-features = false }
tysm = "0.20"
# Directory↔R2 sync engine (github.com/anchpop/osmo). generate-data uses it to mirror
# the .cache directory to a bucket. Git dep until published to crates.io.
osmo = { git = "https://github.com/anchpop/osmo" }
reqwest = { version = "0.13", features = ["json", "query"] }
tokio = { version = "1.52.3", features = ["full"] }
opfs = { version = "0.2.0" }
idb = { version = "0.6.5" }
# Native + wasm fetch wrapper (github.com/anchpop/fetch-happen). Git dep for
# the native reqwest transport until 0.4 is published to crates.io.
fetch-happen = { git = "https://github.com/anchpop/fetch-happen", rev = "879d0fa66bd8ae4331704c5b1d3a193427646336" }
xxhash-rust = { version = "0.8.15", features = ["xxh3", "const_xxh3"] }
indexmap = { version = "2" }
chrono = "0.4.44"
im = { version = "15.1.0", features = ["serde"] }
log = "0.4"
wasm-bindgen = "0.2.122"
thiserror = "2"
slotmap = { version = "1.1", features = ["serde"] }
wasm-logger = "0.2.0"
unicode-normalization = "0.1.25"
weblocks = "0.2.0"
lexide = { git = "https://github.com/anchpop/lexide.git", rev = "8c0a2b093cf70b5797101e36609d92fa6d16fb07", features = [
    "remote",
] }
indicatif = "0.18"

[workspace.dependencies.rkyv]
# path = "../tmp/rkyv/rkyv"
git = "https://github.com/anchpop/rkyv.git"
rev = "3639e126c26b6071dea12eeab8b6376196eb9f59"

[workspace.dependencies.lasso]
# path = "../tmp/lasso"
git = "https://github.com/anchpop/lasso.git"
rev = "babd734da2646353c0924f16882bc61888ae3ba1"

[workspace.dependencies.serde]
version = "1.0"
features = ["derive"]

[profile.release]
# Tell `rustc` to optimize for small code size.
opt-level = "s"
lto = true

[profile.profiling]
inherits = "release"
debug = true
strip = "none"
