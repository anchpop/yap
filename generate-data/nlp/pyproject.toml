[project]
name = "nlp"
version = "0.1.0"
description = "NLP tools for French multiword term detection"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "spacy>=3.7.0",
    "pydantic>=2.0.0",
    "tqdm>=4.66.0",
    # Japanese does not go through spaCy — see the Sudachi section of main.py
    "sudachipy>=0.6.8",
    "sudachidict-core>=20240109",
]
