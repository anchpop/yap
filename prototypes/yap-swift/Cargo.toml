[package]
name = "yap-swift-prototype"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
opfs.workspace = true
yap-frontend-rs = { path = "../../yap-frontend-rs" }
bridgerton.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "time", "net", "fs"] }

[dev-dependencies]
weapon = { path = "../../libraries/weapon" }
chrono.workspace = true
serde_json.workspace = true
