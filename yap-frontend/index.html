<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- onesignal setup -->
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(async function(OneSignal) {
        // Determine if we're in development or production
        const isDevelopment = window.location.hostname === 'localhost' || 
                            window.location.hostname === '127.0.0.1' ||
                            window.location.hostname.includes('dev') ||
                            window.location.port === '5173'; // Vite's default dev port

        const config = isDevelopment ? {
          // Local development
          appId: "cdde60d3-fd8c-4271-87cd-e3f18f6377b4",
          safari_web_id: "web.onesignal.auto.44e66786-7e94-4ade-8822-3a1650cda83f"
        } : {
          // Production
          appId: "31e87860-a9d1-435b-9838-cb7643bb5cdf",
          safari_web_id: "web.onesignal.auto.29ad6177-53c3-46b5-8017-0e7b95131b37"
        };

        console.log(`OneSignal initializing in ${isDevelopment ? 'development' : 'production'} mode`);

        await OneSignal.init({
          ...config,
          notifyButton: {
            enable: false, // Disable the default notification button
          },
          welcomeNotification: {
            disable: true  // This disables the welcome notification
          },
          serviceWorkerParam: { scope: "/push/onesignal/" },
          serviceWorkerPath: "push/onesignal/OneSignalSDKWorker.js"
        });
      });
    </script>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- viewport -->

    <!-- title and description -->
    <title>Yap.Town</title>
    <meta name="description" content="Language learning made easy">

    <!-- pwa -->

    <!-- loading screen styles -->
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: 'Nunito Sans Variable', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
      
      #loading-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: #000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        background-color: #000;
        color: #fff;
      }
      
      #loading-text {
        font-size: 24px;
        margin-bottom: 20px;
        opacity: 0;
        animation: fadeIn 0.3s ease forwards;
        animation-delay: 0.5s;
      }
      
      #loading-spinner {
        width: 40px;
        height: 40px;
        border: 3px solid rgba(255, 255, 255, 0.2);
        border-top-color: #fff;
        border-radius: 50%;
        opacity: 0;
        animation: fadeIn 0.3s ease forwards, spin 1s linear infinite;
        animation-delay: 1s, 0s;
      }
      
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      
      @keyframes fadeIn {
        to { opacity: 0.9; }
      }
      
      #reload-button {
        margin-top: 30px;
        padding: 12px 24px;
        background-color: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.3);
        color: #fff;
        font-size: 16px;
        cursor: pointer;
        border-radius: 4px;
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.3s ease, background-color 0.2s ease;
      }
      
      #reload-button.show {
        opacity: 1;
        visibility: visible;
      }
      
      #reload-button:hover {
        background-color: rgba(255, 255, 255, 0.2);
      }
      
      #reload-button:active {
        background-color: rgba(255, 255, 255, 0.3);
      }
    </style>
  </head>
  <body>
    <!-- Loading screen -->
    <div id="loading-screen">
      <div id="loading-text">Loading Yap.Town...</div>
      <div id="loading-spinner"></div>
      <button id="reload-button" onclick="location.reload(true)">Reload Page</button>
    </div>
    
    <div id="root"></div>
    
    <script>
      var yapBooted = false;

      // Show reload button after 7 seconds
      setTimeout(function() {
        var button = document.getElementById('reload-button');
        if (button && !yapBooted) {
          button.classList.add('show');
        }
      }, 7000);

      // If the app fails to boot — e.g. the WASM module can't be fetched
      // because of a flaky connection or an unsupported browser — surface
      // the reload button right away instead of leaving the user staring
      // at a spinner for 7 seconds.
      function showReloadNow() {
        if (yapBooted) return;
        var loadingText = document.getElementById('loading-text');
        if (loadingText) loadingText.textContent = 'Having trouble loading Yap.Town';
        var button = document.getElementById('reload-button');
        if (button) button.classList.add('show');
      }
      window.addEventListener('error', showReloadNow);
      window.addEventListener('unhandledrejection', showReloadNow);

      // Hide loading screen when React app mounts
      // React will call this when it's ready
      window.hideLoadingScreen = function() {
        yapBooted = true;
        var loadingScreen = document.getElementById('loading-screen');
        if (loadingScreen) {
          loadingScreen.style.display = 'none';
        }
      };
    </script>
    
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
