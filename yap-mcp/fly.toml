# Deploy from the repo root: `flyctl deploy --config yap-mcp/fly.toml`
# Requires secrets: SUPABASE_JWT_SECRET (flyctl secrets set ...)

app = 'yap-mcp'
primary_region = 'ord'

[build]
dockerfile = 'yap-mcp/Dockerfile'

[env]
PORT = '8080'
YAP_MCP_BASE_URL = 'https://yap-mcp.fly.dev'

[http_service]
internal_port = 8080
force_https = true
# OAuth codes and MCP sessions live in memory: keep exactly one machine, always on.
auto_stop_machines = 'off'
auto_start_machines = true
min_machines_running = 1
processes = ['app']

[[http_service.checks]]
grace_period = '10s'
interval = '30s'
method = 'GET'
timeout = '5s'
path = '/health'

[[vm]]
# Language packs deserialize to several hundred MB per course.
memory = '2gb'
cpu_kind = 'shared'
cpus = 1
