# Deploy from the repo root: `flyctl deploy --config yap-mcp/fly.toml`
# Requires secrets (flyctl secrets set ...): SUPABASE_JWT_SECRET,
# SUPABASE_SERVICE_ROLE_KEY (mints connector sessions on approval)

app = 'yap-mcp'
primary_region = 'ord'

[build]
dockerfile = 'yap-mcp/Dockerfile'

[env]
PORT = '8080'
YAP_MCP_BASE_URL = 'https://mcp.yap.town'
# The Cloudflare Worker proxy in front of mcp.yap.town forwards with the
# fly.dev Host header, so both must pass Host validation.
YAP_MCP_ALLOWED_HOSTS = 'yap-mcp.fly.dev'

[http_service]
internal_port = 8080
force_https = true
# Keep the one machine warm (never idle-stop). The single-INSTANCE cap is
# enforced by CI, not here: the deploy job runs `flyctl deploy --ha=false` then
# `flyctl scale count 1`. Hold to one machine — never `fly scale count > 1`:
#   1. All processes write events under the shared "yap-mcp" device id, so a
#      second writer corrupts the per-device event-index sequence and silently
#      drops events (see the single-writer note in src/sync.rs).
#   2. In-flight OAuth codes and MCP sessions live in memory.
auto_stop_machines = 'off'
auto_start_machines = true
min_machines_running = 1
processes = ['app']

[[http_service.checks]]
grace_period = '10s'
interval = '30s'
method = 'GET'
timeout = '5s'
path = '/health'

[[vm]]
# Language packs deserialize to several hundred MB per course.
memory = '2gb'
cpu_kind = 'shared'
cpus = 1
